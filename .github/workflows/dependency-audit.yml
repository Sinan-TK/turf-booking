name: Dependency audit

on:
  schedule:
    - cron: '0 4 * * 1' # every Monday, 04:00 UTC
  pull_request:
    paths:
      - package.json
      - pnpm-lock.yaml
      - '**/package.json'
      - .github/audit-baseline.json
      - scripts/audit-check.mjs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # The pnpm version comes from "packageManager" in the root package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Fails on a high or critical advisory that is not in .github/audit-baseline.json (or whose review date has passed).
      - name: Audit production dependencies
        run: node scripts/audit-check.mjs --all
