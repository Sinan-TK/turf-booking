<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#050505" />
    <title>Offline — Bookyo Admin</title>
    <style>
      html, body { height: 100%; margin: 0; }
      body { display: flex; align-items: center; justify-content: center; background: #FFFCF6; color: #050505; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; text-align: center; padding: 24px; }
      main { max-width: 22rem; }
      img { width: 72px; height: 72px; border-radius: 16px; }
      h1 { font-size: 1.375rem; margin: 20px 0 8px; }
      p { margin: 0 0 24px; color: #5a5750; line-height: 1.5; }
      a { display: inline-block; background: #050505; color: #fff; text-decoration: none; font-weight: 700; padding: 12px 24px; border-radius: 8px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon-192.png" alt="" width="72" height="72" />
      <h1>You are offline</h1>
      <p>Bookyo Admin needs a connection to show your latest information. Check your internet and try again.</p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
